<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do list</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <h1>To-Do list</h1>

        <!-- Две колонки со списками задач -->
        <div class="board">
            <section class="column">
                <h2>To-Do</h2>
                <ul class="tasks">
                    <li class="task">
                        <h3>Create wireframes</h3>
                        <div class="task-info">
                            <span class="priority medium">Medium</span>
                            <time datetime="2024-11-18">18.11.2024</time>
                        </div>
                    </li>
                    <li class="task">
                        <h3>Create light and dark mode</h3>
                        <div class="task-info">
                            <span class="priority low">Low</span>
                            <time datetime="2024-11-18">18.11.2024</time>
                        </div>
                    </li>
                </ul>
            </section>

            <section class="column">
                <h2>Done</h2>
                <ul class="tasks">
                    <li class="task">
                        <h3>Wire up the new user flow</h3>
                        <div class="task-info">
                            <span class="priority high">High</span>
                            <time datetime="2024-11-18">18.11.2024</time>
                        </div>
                    </li>
                    <li class="task">
                        <h3>Create buttons states</h3>
                        <div class="task-info">
                            <span class="priority high">High</span>
                            <time datetime="2024-11-18">18.11.2024</time>
                        </div>
                    </li>
                </ul>
            </section>
        </div>
    </main>
</body>
</html>
